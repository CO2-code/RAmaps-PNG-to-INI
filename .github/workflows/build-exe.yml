name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-modern:
    name: Win10/11 x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (fresh, Windows-native)
        shell: bash
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install

      - run: npm run electron:build

      - uses: actions/upload-artifact@v4
        with:
          name: RA1-PNG-to-INI-win10-x64
          path: release/*.exe

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

  build-legacy:
    name: Win7+ 32-bit (ia32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (fresh, Windows-native)
        shell: bash
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install

      - name: Swap in Electron 22 (last version supporting Windows 7)
        shell: bash
        run: npm install --no-save electron@22.3.27

      - name: Build web app for older Chromium
        shell: bash
        run: npx vite build --target chrome108

      - name: Package 32-bit exe
        shell: bash
        run: npx electron-builder --win portable --ia32 '-c.artifactName=RA1-PNG-to-INI-${version}-win7-ia32.${ext}'

      - uses: actions/upload-artifact@v4
        with:
          name: RA1-PNG-to-INI-win7-ia32
          path: release/*.exe

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe