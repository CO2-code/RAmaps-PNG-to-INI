name: Build Tauri EXE (small)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (fresh, Windows-native)
        shell: bash
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install
          npm install --no-save @tauri-apps/cli@2

      - name: Generate placeholder app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $b = New-Object System.Drawing.Bitmap 1024,1024
          $g = [System.Drawing.Graphics]::FromImage($b)
          $g.Clear([System.Drawing.Color]::FromArgb(180,30,30))
          $f = New-Object System.Drawing.Font("Arial",360,[System.Drawing.FontStyle]::Bold)
          $g.DrawString("RA",$f,[System.Drawing.Brushes]::White,100,280)
          $b.Save("app-icon.png",[System.Drawing.Imaging.ImageFormat]::Png)
          npx tauri icon app-icon.png

      - name: Build exe
        run: npx tauri build --no-bundle

      - name: Locate and stage executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File |
            Where-Object { $_.Name -notlike "*build_script*" -and $_.Name -notlike "*deps*" } |
            Select-Object -First 1
          if (-not $exe) {
            Write-Host "Executables found in src-tauri/target/release:"
            Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File | Select-Object -ExpandProperty FullName
            throw "Compiled Tauri executable was not found."
          }
          Write-Host "Found executable: $($exe.FullName) ($($exe.Length) bytes)"
          New-Item -ItemType Directory -Force -Path "release-tauri" | Out-Null
          Copy-Item $exe.FullName "release-tauri/RAnderer.exe" -Force
          Get-Item "release-tauri/RAnderer.exe" | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: RAnderer-tauri-win-x64
          path: release-tauri/RAnderer.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-tauri/RAnderer.exe